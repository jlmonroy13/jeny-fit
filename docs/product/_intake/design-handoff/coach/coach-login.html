<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JenyFit Coach — Login</title>
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface-sunken);font-family:var(--font-body)}
a{color:var(--brand-primary);text-decoration:none}
a:hover{color:var(--brand-primary-hover)}
img{display:block}
.display{font-family:var(--font-display);font-weight:700;text-transform:uppercase;color:var(--text-primary)}
.card{background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-pill);font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;border:none;padding:11px 18px}
.btn-primary{background:var(--brand-primary);color:#fff}
.btn-secondary{background:var(--surface-wash);color:var(--purple-900)}
.btn-ghost{background:transparent;color:var(--text-secondary)}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:var(--radius-pill);font-size:12px;font-weight:600}
.badge-success{background:var(--alert-success-bg);color:var(--alert-success-icon)}
.badge-warning{background:var(--alert-warning-bg);color:var(--alert-warning-icon)}
.badge-error{background:var(--alert-error-bg);color:var(--alert-error-icon)}
.banner{display:flex;gap:10px;padding:14px 16px;border-radius:var(--radius-md)}
.banner-success{background:var(--alert-success-bg)}
.tag{display:inline-flex;align-items:center;padding:0 16px;height:32px;border-radius:var(--radius-pill);font-size:13px;font-weight:500;background:var(--gray-100);color:var(--text-secondary);white-space:nowrap}
.tag.selected{background:var(--brand-primary);color:#fff}
.daychip{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.daychip.completado{background:var(--day-completado-bg);color:var(--day-completado-fg)}
.daychip.actual{background:var(--day-actual-bg);color:var(--day-actual-fg);border:2px solid var(--brand-primary)}
.daychip.futuro{background:var(--day-futuro-bg);color:var(--day-futuro-fg)}
.input{width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-default);font-family:var(--font-body);font-size:14px;color:var(--text-primary)}
.select{width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-default);font-family:var(--font-body);font-size:14px;color:var(--text-primary);background:var(--surface-page)}
.label{font-size:12px;color:var(--text-muted);margin-bottom:6px;display:block;font-weight:600}
.rir{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.shell{width:1280px;max-width:100%;margin:16px auto 40px;background:var(--surface-page);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);display:flex;min-height:800px;overflow:hidden}
.sidebar{width:220px;background:var(--surface-card);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;padding:20px 12px;gap:4px;flex-shrink:0}
.sidebar .logo{font-family:var(--font-display);font-weight:700;font-size:18px;text-transform:uppercase;color:var(--brand-primary);padding:0 10px 20px}
.navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;color:var(--text-secondary)}
.navitem img{width:17px;height:17px;opacity:0.65}
.navitem.active{background:var(--surface-wash);color:var(--purple-900);font-weight:600}
.navitem.active img{opacity:1;filter:invert(24%) sepia(31%) saturate(1400%) hue-rotate(240deg)}
.main{flex:1;overflow-y:auto;padding:28px}
.tabsbar{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto}
.tabitem{padding:9px 18px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;color:var(--text-secondary);background:var(--gray-100);white-space:nowrap}
.tabitem.active{background:var(--brand-primary);color:#fff}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--text-muted);padding:12px 20px;border-bottom:1px solid var(--border-subtle);font-weight:400}
td{padding:14px 20px;border-bottom:1px solid var(--border-subtle);font-size:14px;color:var(--text-secondary)}
.tablewrap{background:var(--surface-card);border-radius:var(--radius-lg);border:1px solid var(--border-subtle);overflow:hidden}
</style>
</head>
<body>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center">
  <div style="width:380px;background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:36px 32px;display:flex;flex-direction:column;gap:16px">
    <div class="display" style="font-size:22px;color:var(--brand-primary);text-align:center">JenyFit</div>
    <div class="display" style="font-size:20px;text-align:center;margin-top:-8px">Panel de coach</div>
    <p style="margin:-6px 0 4px;text-align:center;font-size:13px;color:var(--text-muted)">Ingresa para gestionar tus clientas</p>
    <div><label class="label">Usuario</label><input class="input" placeholder="jeny.coach"></div>
    <div><label class="label">Contraseña</label><input class="input" type="password" placeholder="••••••••"></div>
    <a href="coach-dashboard.html" class="btn btn-primary" style="width:100%;text-align:center">Iniciar sesión</a>
    <a href="#" style="text-align:center;font-size:12px">¿Olvidaste tu contraseña? Te enviamos un enlace por correo.</a>
  </div>
</div>

</body>
</html>
